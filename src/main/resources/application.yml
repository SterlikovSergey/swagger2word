server:
  port: 8081
  # Настройки для больших запросов
  max-http-request-size: 50MB
  max-http-request-header-size: 65536

app:
  output-directory: ./generated-docs
  # Таймауты
  connection-timeout: 30000
  read-timeout: 60000

spring:
  web:
    resources:
      add-mappings: false
  webflux:
    max-in-memory-size: 50MB
    # Настройки codec для больших JSON
    codec:
      max-in-memory-size: 50MB
  # НАСТРОЙКИ JACKSON - ИСПРАВЛЕННАЯ ВЕРСИЯ
  jackson:
    default-property-inclusion: NON_NULL
    deserialization:
      fail-on-unknown-properties: false
    # Убраны невалидные свойства
  # Глобальные настройки кодеков для больших JSON
  codec:
    max-in-memory-size: 50MB

# Логирование
logging:
  level:
    com.usnbook.swagger2word: INFO
    org.springframework.web: INFO
    reactor.netty: WARN
    org.springframework.web.reactive.function.client: DEBUG
  file:
    name: ./logs/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"